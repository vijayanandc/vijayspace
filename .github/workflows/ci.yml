# Client CI: everything `npm run check` runs (typecheck, lint, architecture, tests, build).
name: client
on:
  push:
    branches: [client]
  pull_request:
    branches: [client]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
